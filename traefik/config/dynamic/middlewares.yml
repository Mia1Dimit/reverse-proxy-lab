http:
  middlewares:
    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    umami-strip:
      stripPrefix:
        prefixes:
          - /analytics

    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "no-referrer"
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customResponseHeaders:
          Server: ""