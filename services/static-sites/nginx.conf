server {
  listen 80;
  server_name _;
  # emit relative Location headers so redirects work behind any hostname/proxy
  absolute_redirect off;

  root /srv/landing/dist;

  # Landing — base:'/' so assets live at /assets/
  location /assets/ {
    root /srv/landing/dist;
  }

  location = / {
    index index.html;
  }

  # About-me — base:'/about-me/' so assets live at /about-me/assets/
  location = /about-me {
    return 301 /about-me/;
  }

  location /about-me/ {
    alias /srv/about-me/dist/;
    index index.html;
  }

  # Certifications — base:'/certifications/'
  location = /certifications {
    return 301 /certifications/;
  }

  location /certifications/ {
    alias /srv/certifications/dist/;
    index index.html;
  }
}
