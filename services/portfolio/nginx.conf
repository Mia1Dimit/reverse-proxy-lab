server {
  listen 80;
  server_name _;
  absolute_redirect off;

  location = /portfolio { return 301 /portfolio/; }

  # SPA: alias maps /portfolio/* to the built dist root
  location /portfolio/ {
    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ /portfolio/index.html;
  }
}
